name: Ingest HHS OCR breach records

# Runs the Phase 1 ingest against the live HHS Office for Civil Rights breach
# portal, writes to the remote D1 database, exports the build input, and
# deploys the refreshed site.
#
# Manual dispatch plus a daily 06:00 UTC schedule (spec section 1). The daily
# run is what keeps the record current; the portal publishes new breaches
# continuously.
#
# OCR publishes two separate breach reports, and this workflow can ingest
# either or both:
#   hhs_ocr   - the HIPAA report (breach_report_hip.jsf)
#   hhs_part2 - the 42 CFR Part 2 report (breach_report_part2.jsf), covering
#               substance use disorder treatment records
# Each is a distinct legal regime with its own listing. They are ingested as
# separate sources so provenance stays exact, then exported and deployed once.
#
# The scheduled run ingests both reports. The scheduled run uses
# coverage=current deliberately: the archive view holds a decade of closed
# cases that do not change, so re-fetching it daily is a large fetch for no new
# facts. Manual dispatch defaults to 'all', which requires the archive and
# fails loudly if it cannot be reached.
#
# Requires the same secrets as deploy.yml:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Which OCR report to ingest'
        type: choice
        options: [hhs_ocr, hhs_part2, both]
        default: hhs_ocr
      dry_run:
        description: 'Parse and score, but do not write to D1'
        type: boolean
        default: false
      coverage:
        description: 'all = require the archive view as well; current = under-investigation view only, documented on /sources'
        type: choice
        options: [all, current]
        default: all
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify credentials are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set. Nothing was ingested."
            exit 1
          fi

      - run: npm test

      # The portal is a stateful JSF app with no static CSV URL, so this step
      # drives its form sequence. It fails loudly on any deviation rather than
      # publishing a partial record set as if it were complete.
      #
      # With source=both, a failure in EITHER report fails the whole step. That
      # is deliberate: a run that quietly ingested one regime and skipped the
      # other would leave the site claiming coverage it does not have.
      - name: Ingest HHS OCR breach portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_SOURCE: ${{ github.event.inputs.source || 'both' }}
          INGEST_COVERAGE: ${{ github.event.inputs.coverage || (github.event_name == 'schedule' && 'current' || 'all') }}
          INGEST_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # pipefail is essential: without it the exit code comes from tee and
          # a failed ingest reports as a successful step.
          set -o pipefail
          set -e
          if [ "$INGEST_SOURCE" = "both" ]; then
            SOURCES="hhs_ocr hhs_part2"
          else
            SOURCES="$INGEST_SOURCE"
          fi
          DRY=""
          if [ "$INGEST_DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          STAGE=/tmp/ingest-staged
          MANIFEST=/tmp/ingest-manifest
          rm -rf "$STAGE" "$MANIFEST"
          mkdir -p "$STAGE" "$MANIFEST"
          : > /tmp/ingest.log

          # PHASE 1 -- fetch, parse and validate EVERY source. Nothing is
          # written to D1 in this phase. Writing each source as it is
          # ingested would leave the first source's rows already committed
          # when the second source fails: the step fails, but the earlier
          # write is NOT rolled back, and the site would then be serving a
          # record set that claims coverage it does not have.
          for s in $SOURCES; do
            echo "=== ingest: $s (coverage=$INGEST_COVERAGE) ===" | tee -a /tmp/ingest.log
            node packages/ingest/run.js --source "$s" --remote \
              --coverage "$INGEST_COVERAGE" $DRY --stage "$STAGE" \
              --manifest-dir "$MANIFEST" 2>&1 | tee -a /tmp/ingest.log
          done

          # PHASE 2 -- write the staged statements, which are exactly the
          # statements phase 1 validated and computed. Reached only when every
          # source passed its coverage checks.
          if [ -z "$DRY" ]; then
            EXPECT=$(echo $SOURCES | tr ' ' ',')
            echo "=== ingest: applying staged data for: $SOURCES ===" | tee -a /tmp/ingest.log
            node packages/ingest/run.js --apply "$STAGE" --remote \
              --expect-sources "$EXPECT" 2>&1 | tee -a /tmp/ingest.log
          fi

      - name: Publish ingest summary
        if: always()
        run: |
          {
            echo '## Ingest run'
            echo '```'
            tail -80 /tmp/ingest.log 2>/dev/null || echo 'no log produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rejected records for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-rejects
          path: docs/ingest-rejects.log
          if-no-files-found: ignore

      - name: Upload ingest manifest and applied receipt for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-manifest
          path: |
            /tmp/ingest-manifest
            /tmp/ingest-staged/applied.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Export build input from D1
        if: github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/export-data.js --remote

      - name: Build
        if: github.event.inputs.dry_run != 'true'
        run: npm run build

      # Retain the actual database export used by this build, separately from
      # the source-observation manifests. A green export/build alone cannot
      # establish which records reached the published site.
      - name: Retain publication data for verification
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publication-data
          path: |
            site/data/breaches.json
            site/data/sources.json
            site/data/litigation.json
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Pages
        if: github.event.inputs.dry_run != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name breachledger --branch ${{ vars.PAGES_BRANCH || 'main' }}
